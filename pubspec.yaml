name: moviehub_app
description: "A Flutter movie app using TMDB API"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.0
  crypto: ^3.0.7

  # UI & Design
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.2.1

  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Connectivity & Permissions
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1

  # File & System
  url_launcher: ^6.2.6
  path_provider: ^2.1.3
  path: ^1.8.3
  share_plus: ^7.2.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.3.10
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.1

  # Ads & Env
  google_mobile_ads: ^5.3.1
  flutter_dotenv: ^5.1.0

  # Trailers & Loading
  webview_flutter: ^4.10.0
  shimmer: ^3.0.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
