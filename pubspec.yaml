name: moviehub_app
description: "A Flutter movie app using TMDB API"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # UI & Design
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.2

  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Connectivity & Permissions
  connectivity_plus: ^7.0.0
  permission_handler: ^11.3.1

  # File & System
  url_launcher: ^6.2.6
  path_provider: ^2.1.3
  open_file: ^3.3.3
  path: ^1.8.3

  # Firebase
  firebase_core: ^3.0.0
  firebase_analytics: ^11.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1

  # Ads & Env
  google_mobile_ads: ^5.0.0
  flutter_dotenv: ^5.1.0

  # Video
  video_player: ^2.8.2
  youtube_player_flutter: ^9.0.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
