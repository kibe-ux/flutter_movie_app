// Opt-in local update of the existing phone's debug package. Repository and
// release application IDs remain defined by android/app/build.gradle.
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        if (gradle.startParameter.taskNames.any { !it.toLowerCase().contains('debug') }) {
            throw new GradleException('This local package override permits debug tasks only.')
        }
        project.androidComponents.finalizeDsl { android ->
            android.defaultConfig.applicationId = 'com.moviehub.app'
            android.defaultConfig.ndk.abiFilters.clear()
            android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
        }
    }
    project.plugins.withId('com.android.library') {
        project.androidComponents.finalizeDsl { android ->
            android.defaultConfig.ndk.abiFilters.clear()
            android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
        }
    }
}
